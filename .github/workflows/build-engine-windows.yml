name: Build ASTROBOT Emulator Engine (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine/kytyps5"
      - ".gitmodules"
      - ".github/workflows/build-engine-windows.yml"
      - "docs/UPSTREAM_AND_LICENSE.md"

permissions:
  contents: read

jobs:
  build-engine:
    runs-on: windows-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Use Clang shipped with Visual Studio
        shell: pwsh
        run: |
          Join-Path $env:VCINSTALLDIR "Tools\Llvm\x64\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install glslang tools
        shell: pwsh
        run: |
          vcpkg install glslang[tools,opt]:x64-windows
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          "$vcpkgRoot\installed\x64-windows\tools\glslang" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Verify toolchain
        shell: cmd
        run: |
          cmake --version
          ninja --version
          clang-cl --version
          glslangValidator --version
          echo Qt6_DIR=%Qt6_DIR%

      - name: Configure ASTROBOT fork
        shell: cmd
        run: |
          cmake -S engine/kytyps5 -B _Build/astrobot ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=ekoagengs-bot/gameastrobot ^
            -DKYTY_PROJECT_NAME=ASTROBOT ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build native emulator and launcher
        run: cmake --build _Build/astrobot --target launcher --parallel

      - name: Install native application
        run: cmake --install _Build/astrobot --prefix _Build/astrobot/install

      - name: Package ASTROBOT Emulator
        shell: pwsh
        run: Compress-Archive -Path "_Build/astrobot/install/*" -DestinationPath "ASTROBOT-Emulator-Windows-x64.zip" -Force

      - name: Upload native emulator
        uses: actions/upload-artifact@v4
        with:
          name: ASTROBOT-Emulator-Windows-x64
          path: ASTROBOT-Emulator-Windows-x64.zip
          if-no-files-found: error
